spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rakshak_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:apoorva}

# Tells Hibernate to keep the database in sync and print SQL commands to the terminal
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Rakshak AI Email SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# You must change the email and password below
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true