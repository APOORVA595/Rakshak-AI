<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakshak AI | Global Command Center</title>
    <!-- Leaflet & FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Top Command Bar */
        .topbar {
            height: 70px; background-color: #0b1121;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 2px solid var(--panel-bg);
            z-index: 2000;
        }
        .brand { font-size: 22px; font-weight: bold; color: white; display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--accent-red); }

        .topbar-right { display: flex; align-items: center; gap: 20px; }
        .global-stats { display: flex; gap: 15px; }
        .stat-box { background: var(--panel-bg); padding: 6px 15px; border-radius: 6px; text-align: center; min-width: 80px; border-top: 3px solid #334155; }
        .stat-value { font-size: 18px; font-weight: bold; }
        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

        .evac-btn {
            background-color: #7f1d1d; color: #fca5a5; border: 2px solid var(--accent-red);
            padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .evac-btn.active { background-color: var(--accent-red); color: white; animation: pulse 1s infinite; }
        .evac-btn:hover { opacity: 0.9; }

        /* Workspace */
        .main-workspace { display: flex; flex-grow: 1; position: relative; }

        /* Left Roster */
        .roster-sidebar { width: 280px; background-color: var(--panel-bg); border-right: 2px solid #0b1121; padding: 15px; overflow-y: auto; z-index: 1000; }
        .roster-card { background: #273548; padding: 12px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; border-left: 4px solid #334155; transition: 0.2s; }
        .roster-card:hover { background: #334155; }
        .roster-safe { border-left-color: var(--accent-green); }
        .roster-danger { border-left-color: var(--accent-red); animation: border-pulse 1.5s infinite; }
        .roster-dispatched { border-left-color: var(--accent-yellow); }

        /* Map Area */
        .map-container { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; background-color: #000; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

        /* Right Sidebar */
        .sidebar { width: 380px; background-color: var(--panel-bg); padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 1000; }
        .profile-header { display: flex; gap: 15px; margin-bottom: 15px; }
        .profile-photo { width: 70px; height: 70px; background: #334155; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: var(--text-muted); }
        .profile-name { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; }
        .profile-id { font-size: 12px; color: var(--text-muted); }

        .info-card { background: #273548; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .info-card h4 { margin: 0 0 8px 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 4px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .info-label { color: var(--text-muted); }
        .info-value { font-weight: 600; }

        /* Action Buttons */
        .action-btn { width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; margin-top: 8px; }
        .btn-dispatch { background: var(--accent-yellow); color: #000; }
        .btn-alive { background: var(--accent-green); color: #fff; }
        .btn-casualty { background: #475569; color: #fff; }
        
        textarea { width: 100%; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 4px; padding: 6px; box-sizing: border-box; margin-top: 5px; font-family: inherit; font-size: 12px; resize: none; }

        /* Timeline */
        .timeline-list { list-style: none; padding: 0; margin: 0; }
        .time-item { display: flex; gap: 10px; margin-bottom: 8px; font-size: 12px; padding: 8px; background: #334155; border-radius: 4px; }
        .time-item.danger { border-left: 3px solid var(--accent-red); background: #3a1a1a; }
        .time-stamp { color: var(--text-muted); font-weight: bold; min-width: 60px; }

        @keyframes border-pulse { 0% { border-left-color: rgba(239, 68, 68, 0.4); } 50% { border-left-color: rgba(239, 68, 68, 1); } 100% { border-left-color: rgba(239, 68, 68, 0.4); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .current-marker { background-color: var(--accent-red); border: 2px solid white; border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; width: 35px; height: 35px; font-size: 16px; }
        .start-marker { background-color: var(--accent-green); border: 2px solid white; border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; width: 35px; height: 35px; font-size: 9px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Top Command Bar -->
    <div class="topbar">
        <div class="brand"><i class="fa-solid fa-satellite-dish"></i> Rakshak AI Base Camp</div>
        
        <div class="topbar-right">
            <button id="evac-toggle-btn" class="evac-btn" onclick="toggleGlobalEvacuation()">🚨 TRIGGER GLOBAL EVACUATION</button>
            <div class="global-stats">
                <div class="stat-box"><div class="stat-value" id="stat-registered">0</div><div class="stat-label">Registered</div></div>
                <div class="stat-box" style="border-color: var(--accent-red);"><div class="stat-value" id="stat-sos" style="color: var(--accent-red);">0</div><div class="stat-label">Active SOS</div></div>
                <div class="stat-box" style="border-color: var(--accent-green);"><div class="stat-value" id="stat-alive" style="color: var(--accent-green);">0</div><div class="stat-label">Safe / Rescued</div></div>
            </div>
        </div>
    </div>

    <!-- Workspace -->
    <div class="main-workspace">
        <div class="roster-sidebar">
            <h3 style="color: var(--text-muted); font-size: 13px; text-transform: uppercase;">Active Roster</h3>
            <div id="roster-container">Loading personnel...</div>
        </div>

        <div class="map-container"><div id="map"></div></div>

        <div class="sidebar" id="sidebar-content">
            <h3 style="color: var(--text-muted); text-transform: uppercase; font-size: 13px; margin-top: 0;">Target Acquired</h3>
            <div style="text-align: center; color: var(--text-muted); padding: 50px 0;">Select a tourist from the roster on the left...</div>
        </div>
    </div>

    <script>
        var map = L.map('map').setView([12.934, 77.535], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        var trackingLayer = L.layerGroup().addTo(map);
        
        let currentTargetId = null;
        let alertedTourists = new Set(); // Tracks individual IDs to avoid repeat/ghost beeps
        let globalEvacState = false; 

        // Audio Beep using Web Audio API
        function playBeep() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.value = 880; 
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) { console.log("Audio context blocked"); }
        }

        function loadGlobalRoster() {
            fetch('/api/checkpoints/tourists')
                .then(res => res.json())
                .then(tourists => {
                    let sosTourists = tourists.filter(t => t.status === 'SOS_ACTIVE');
                    let sosCount = sosTourists.length;

                    let hasNewAlert = false;
                    sosTourists.forEach(t => {
                        if (!alertedTourists.has(t.touristId)) {
                            hasNewAlert = true;
                            alertedTourists.add(t.touristId);
                        }
                    });

                    if (hasNewAlert && sosTourists.length > 0) {
                        playBeep();
                        console.warn("⚠️ NEW EMERGENCY DETECTED ON MOUNTAIN!");
                    }

                    tourists.forEach(t => {
                        if (t.status !== 'SOS_ACTIVE') {
                            alertedTourists.delete(t.touristId);
                        }
                    });

                    document.getElementById('stat-registered').innerText = tourists.length;
                    document.getElementById('stat-sos').innerText = sosCount;
                    document.getElementById('stat-alive').innerText = tourists.filter(t => t.status === 'FOUND_ALIVE' || t.status === 'TRACKING_ACTIVE').length;

                    const container = document.getElementById('roster-container');
                    container.innerHTML = '';
                    
                    tourists.forEach(t => {
                        let statusClass = 'roster-safe';
                        if (t.status === 'SOS_ACTIVE') statusClass = 'roster-danger';
                        if (t.status === 'DISPATCHED') statusClass = 'roster-dispatched';

                        const card = document.createElement('div');
                        card.className = `roster-card ${statusClass}`;
                        if (currentTargetId === t.touristId) {
                            card.style.borderRight = '4px solid white';
                            card.style.background = '#334155';
                        }
                        
                        card.onclick = () => {
                            currentTargetId = t.touristId;
                            window.mapInitialized = false;
                            updateTargetTelemetry();
                            loadGlobalRoster();
                        };
                        
                        card.innerHTML = `
                            <div style="font-weight: bold;">${t.fullName}</div>
                            <div style="font-size: 11px; color: var(--text-muted);">${t.touristId}</div>
                            <div style="font-size: 11px; margin-top: 4px; font-weight: bold;">
                                Status: ${t.status}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                });
        }

        function updateTargetTelemetry() {
            if (!currentTargetId) return;

            fetch('/api/checkpoints/history/' + currentTargetId)
                .then(response => response.json())
                .then(data => {
                    if(data.length === 0) return;

                    var coordinatePath = [];
                    var currentPing = data[0]; 
                    var startPing = data[data.length - 1]; 
                    var tStatus = currentPing.tourist.status;

                    let timelineHTML = '<ul class="timeline-list">';
                    data.forEach(point => {
                        let timeString = point.recordedAt ? new Date(point.recordedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
                        timelineHTML += `
                            <li class="time-item ${point.isAnomaly ? 'danger' : ''}">
                                <div class="time-stamp">${timeString}</div>
                                <div style="flex-grow: 1;">
                                    <strong>HR: ${point.heartRate} BPM</strong><br>
                                    <span style="font-size: 11px; color: ${point.isAnomaly ? 'var(--accent-red)' : 'var(--accent-green)'}">
                                        ${point.isAnomaly ? '🚨 AI Anomaly' : 'Normal'}
                                    </span>
                                </div>
                            </li>
                        `;
                    });
                    timelineHTML += '</ul>';

                    let actionButtons = '';
                    if (tStatus === 'SOS_ACTIVE') {
                        actionButtons = `<button class="action-btn btn-dispatch" onclick="updateLifecycle('${currentTargetId}', 'DISPATCHED')">🚨 Deploy Rescue Team</button>`;
                    } else if (tStatus === 'DISPATCHED') {
                        actionButtons = `
                            <textarea id="rescue-notes" placeholder="Enter health condition (e.g., Stable, minor sprain)..." rows="2"></textarea>
                            <button class="action-btn btn-alive" onclick="updateLifecycleWithNotes('${currentTargetId}', 'FOUND_ALIVE')">✅ Mark Found Alive</button>
                            <button class="action-btn btn-casualty" onclick="updateLifecycleWithNotes('${currentTargetId}', 'CASUALTY')">❌ Mark Casualty</button>
                        `;
                    } else {
                        actionButtons = `<div style="color: var(--accent-green); font-size: 12px; margin-top: 5px; text-align: center;">Case Closed / Safe</div>`;
                    }

                    document.getElementById('sidebar-content').innerHTML = `
                        <h3 style="color: var(--text-muted); text-transform: uppercase; font-size: 13px; margin-top: 0;">Command Control</h3>
                        <div class="profile-header">
                            <div class="profile-photo"><i class="fa-solid fa-user"></i></div>
                            <div>
                                <h2 class="profile-name">${currentPing.tourist.fullName}</h2>
                                <div class="profile-id">ID: ${currentPing.tourist.touristId}</div>
                                <div style="color: var(--accent-yellow); font-weight: bold; font-size: 12px; margin-top: 5px;">
                                    STAGE: ${tStatus}
                                </div>
                            </div>
                        </div>
                        
                        <div class="info-card">
                            <h4>Medical Triage & Actions</h4>
                            <div class="info-row"><span class="info-label">Heart Rate:</span> <span class="info-value">${currentPing.heartRate} BPM</span></div>
                            <div class="info-row"><span class="info-label">Blood Type:</span> <span class="info-value">${currentPing.tourist.bloodType || 'Unknown'}</span></div>
                            <div class="info-row"><span class="info-label">Conditions:</span> <span class="info-value">${currentPing.tourist.medicalConditions || 'None'}</span></div>
                            ${actionButtons}
                        </div>

                        <div class="info-card">
                            <h4>Incident Timeline</h4>
                            <div style="max-height: 200px; overflow-y: auto; padding-right: 5px;">
                                ${timelineHTML}
                            </div>
                        </div>
                    `;

                    trackingLayer.clearLayers();
                    var lastPoint = null;
                    data.forEach((ping, index) => {
                        var lat = parseFloat(ping.latitude);
                        var lon = parseFloat(ping.longitude);
                        var currentLatLng = L.latLng(lat, lon);

                        if (!lastPoint || lastPoint.distanceTo(currentLatLng) > 15 || index === data.length - 1) {
                            coordinatePath.push([lat, lon]);
                            lastPoint = currentLatLng;

                            if(index !== 0 && index !== data.length - 1) {
                                L.circleMarker([lat, lon], { radius: 4, fillColor: "#ef4444", color: "#fff", weight: 1 }).addTo(trackingLayer);
                            }
                        }
                    });

                    var polyline = L.polyline(coordinatePath, {color: '#ef4444', weight: 4}).addTo(trackingLayer);
                    L.polylineDecorator(polyline, { patterns: [{offset: 25, repeat: 50, symbol: L.Symbol.arrowHead({pixelSize: 10, pathOptions: {color: '#fbbf24', weight: 3}})}]}).addTo(trackingLayer);

                    var startIcon = L.divIcon({ className: '', html: "<div class='start-marker'>START</div>", iconSize: [35, 35], iconAnchor: [17, 17] });
                    L.marker([startPing.latitude, startPing.longitude], {icon: startIcon}).addTo(trackingLayer);

                    var currentIcon = L.divIcon({ className: '', html: "<div class='current-marker'><i class='fa-solid fa-street-view'></i></div>", iconSize: [35, 35], iconAnchor: [17, 17] });
                    L.marker([currentPing.latitude, currentPing.longitude], {icon: currentIcon}).addTo(trackingLayer);

                    if(!window.mapInitialized) { map.fitBounds(polyline.getBounds(), {padding: [50, 50]}); window.mapInitialized = true; }
                });
        }

        function updateLifecycle(touristId, newStatus) {
            fetch(`/api/checkpoints/update-status/${touristId}?status=${newStatus}`, { method: 'POST' })
                .then(res => {
                    loadGlobalRoster();
                    updateTargetTelemetry();
                });
        }

        function updateLifecycleWithNotes(touristId, newStatus) {
            let notes = document.getElementById('rescue-notes').value;
            fetch(`/api/checkpoints/update-status/${touristId}?status=${newStatus}&notes=${encodeURIComponent(notes)}`, { method: 'POST' })
                .then(res => {
                    loadGlobalRoster();
                    updateTargetTelemetry();
                });
        }

        function toggleGlobalEvacuation() {
            globalEvacState = !globalEvacState;

            fetch(`/api/checkpoints/evacuate?active=${globalEvacState}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    let btn = document.getElementById('evac-toggle-btn');
                    if (data.evacuationActive) {
                        btn.classList.add('active');
                        btn.innerText = "🛑 STOP GLOBAL EVACUATION";
                        alert("⚠️ GLOBAL EVACUATION BROADCAST ACTIVE!");
                    } else {
                        btn.classList.remove('active');
                        btn.innerText = "🚨 TRIGGER GLOBAL EVACUATION";
                        alert("Global evacuation alert cancelled.");
                    }
                });
        }

        setTimeout(() => { map.invalidateSize(); }, 500);
        loadGlobalRoster();
        setInterval(() => {
            loadGlobalRoster();
            if(currentTargetId) updateTargetTelemetry();
        }, 3000);
    </script>
</body>
</html>
